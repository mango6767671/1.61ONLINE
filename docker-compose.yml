services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: online
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - online-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d online"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node dist/scripts/migrate.js && npm start"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/online
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DISCORD_BOT_API_KEY: ${DISCORD_BOT_API_KEY:?Set DISCORD_BOT_API_KEY in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "dist/bot/src/index.js"]
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      COMMUNITY_API_BASE_URL: http://api:3000
      DISCORD_BOT_API_KEY: ${DISCORD_BOT_API_KEY:?Set DISCORD_BOT_API_KEY in .env}
      DISCORD_ADMIN_ROLE_IDS: ${DISCORD_ADMIN_ROLE_IDS:-}
      DISCORD_MOD_ROLE_IDS: ${DISCORD_MOD_ROLE_IDS:-}
      DISCORD_VERIFIED_ROLE_ID: ${DISCORD_VERIFIED_ROLE_ID:-}
      DISCORD_LOG_CHANNEL_ID: ${DISCORD_LOG_CHANNEL_ID:-}
      DISCORD_ANNOUNCEMENT_CHANNEL_ID: ${DISCORD_ANNOUNCEMENT_CHANNEL_ID:-}
      DISCORD_TICKET_CATEGORY_ID: ${DISCORD_TICKET_CATEGORY_ID:-}

volumes:
  online-postgres-data:
