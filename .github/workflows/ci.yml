name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: online_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d online_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/online_test
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
          NODE_ENV: test
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/online_test
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
          NODE_ENV: test
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/online_test
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
          NODE_ENV: test
      - run: npm run build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/online_test
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
          NODE_ENV: test
